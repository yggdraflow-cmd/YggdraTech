<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Conheça os serviços da YggdraTech."
  >

  <title>Serviços | YggdraTech</title>

  <link
    rel="stylesheet"
    href="../css/style.css?v=6.0"
  >

  <link
    rel="stylesheet"
    href="../css/prismo-home.css?v=1.0"
  >

  <link
    rel="stylesheet"
    href="../css/prismo-pages.css?v=3.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body class="home-prismo prismo-internal-page">

  <div id="navbar-container"></div>

  <main class="yggdratech-services-public">

    <section class="yggdratech-services-hero">
      <div class="yggdratech-services-container">

        <p class="yggdratech-services-kicker">
          SERVIÇOS
        </p>

        <h1 id="services-page-title">
          Serviços YggdraTech
        </h1>

        <p
          id="services-page-message"
          class="yggdratech-services-message"
        >
          Carregando nossos serviços...
        </p>

      </div>
    </section>

    <section class="yggdratech-services-list">
      <div class="yggdratech-services-container">

        <div
          id="services-loading"
          class="yggdratech-services-status"
        >
          Carregando serviços...
        </div>

        <div
          id="services-error"
          class="yggdratech-services-status yggdratech-services-error"
          hidden
        ></div>

        <div
          id="services-grid"
          class="yggdratech-services-grid"
        ></div>

      </div>
    </section>

  </main>

  <footer class="footer">
    <p>
      &copy; 2026 YggdraTech. Todos os direitos reservados.
    </p>
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/services.js"></script>

</body>

</html>
