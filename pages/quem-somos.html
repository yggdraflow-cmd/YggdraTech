<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Conheça quem está por trás da YggdraTech."
  >

  <title>Quem Somos | YggdraTech</title>

  <link
    rel="stylesheet"
    href="../css/style.css?v=6.0"
  >

  <link
    rel="stylesheet"
    href="../css/prismo-home.css?v=1.0"
  >

  <link
    rel="stylesheet"
    href="../css/prismo-pages.css?v=2.0"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
</head>

<body class="home-prismo prismo-internal-page">

  <div id="navbar-container"></div>

  <main class="yggdratech-about">
    <section class="yggdratech-about-hero">
      <div class="yggdratech-about-container">
        <p class="yggdratech-about-kicker">
          QUEM SOMOS
        </p>

        <h1 id="about-title">
          Conheça a YggdraTech
        </h1>

        <p
          id="about-description"
          class="yggdratech-about-description"
        >
          Carregando nossa história...
        </p>
      </div>
    </section>

    <section class="yggdratech-about-team">
      <div class="yggdratech-about-container">
        <div
          id="about-loading"
          class="yggdratech-about-status"
        >
          Carregando integrantes...
        </div>

        <div
          id="about-error"
          class="yggdratech-about-status yggdratech-about-error"
          hidden
        ></div>

        <div
          id="about-members"
          class="yggdratech-about-members"
        ></div>
      </div>
    </section>

    <section
      id="about-biographies-section"
      class="yggdratech-about-biographies"
      hidden
    >
      <div
        id="about-biographies"
        class="yggdratech-about-container"
      ></div>
    </section>
  </main>

  <footer class="footer">
    <p>
      &copy; 2026 YggdraTech. Todos os direitos reservados.
    </p>
  </footer>

  <script src="../js/navbar.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/quem-somos.js"></script>

</body>

</html>
