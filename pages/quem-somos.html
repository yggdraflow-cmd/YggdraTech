<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <!-- Configurações básicas -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título da página -->
  <title>Quem Somos - Yggdra Tech</title>

  <!-- CSS principal -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

  <!-- NAVBAR GLOBAL -->
  <div id="navbar-container"></div>

  <!-- HERO QUEM SOMOS -->
  <section class="about-hero">

    <div class="about-hero-content">

      <h1>
        Tecnologia que impulsiona grandes negócios
      </h1>

      <p>
        Somos uma consultoria brasileira de tecnologia com foco em inovação,
        desenvolvimento e soluções digitais de alto impacto.
      </p>

      <div class="about-hero-btn">
      <a
  href="https://wa.me/5511978880443"
  target="_blank"
  class="direction-btn-primary"
>
  Vamos conversar
</a>
      </div>

    </div>

  </section>

  <!-- VÍDEO INSTITUCIONAL -->
  <section class="about-video-section">

    <h2>
      Quem Somos
    </h2>

    <div class="about-video">

      <video
        controls
        autoplay
        muted
        loop
        playsinline>

        <source src="../img/quem-somos.mp4" type="video/mp4">

        Seu navegador não suporta vídeo.

      </video>

    </div>

  </section>

  <!-- REDES SOCIAIS -->
  <section class="about-social-section">

    <h2>
      Siga-nos nas redes sociais
    </h2>

    <div class="social-card">

      <!-- Instagram -->
      <a
        href="https://www.instagram.com/yggdra_tech"
        target="_blank"
        class="socialContainer containerOne">

        <i class="fab fa-instagram"></i>

      </a>

      <!-- X / Twitter -->
      <a
        href="https://twitter.com"
        target="_blank"
        class="socialContainer containerTwo">

        <i class="fab fa-x-twitter"></i>

      </a>

      <!-- LinkedIn -->
      <a
        href="https://linkedin.com/company/yggdra-tech"
        target="_blank"
        class="socialContainer containerThree">

        <i class="fab fa-linkedin-in"></i>

      </a>

      <!-- E-mail -->
      <a
        href="mailto:yggdratech@outlook.com"
        class="socialContainer containerFour">

        <i class="fas fa-envelope"></i>

      </a>

    </div>

  </section>

  <!-- RODAPÉ -->
  <footer class="footer">

    <p>
      &copy; 2024 Yggdra Tech. Todos os direitos reservados.
    </p>

  </footer>

  <!-- SCRIPTS -->
  <script src="../js/navbar.js"></script>
  <script src="../js/script.js"></script>

</body>

</html>
